name: Android debug build

on:
  push:
    paths:
      - "sonic1-persian/**"
      - ".github/workflows/sonic1-persian-android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sonic1-persian
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: sonic1-persian-debug
          path: sonic1-persian/app/build/outputs/apk/debug/app-debug.apk
