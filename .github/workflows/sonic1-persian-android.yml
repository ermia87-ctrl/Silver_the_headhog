name: Android debug build

on:
  push:
    paths:
      - "sonic1-persian/**"
      - ".github/workflows/sonic1-persian-android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sonic1-persian
    steps:
      - uses: actions/checkout@v4
      - name: Prepare the user's supplied game ROM
        run: |
          set -euo pipefail
          ROM_ENTRY="$(unzip -Z1 "Sonic The Hedgehog (USA, Europe).zip" | grep -Ei '\.(md|bin|gen)$' | head -n 1)"
          test -n "$ROM_ENTRY"
          mkdir -p app/src/main/assets
          unzip -p "Sonic The Hedgehog (USA, Europe).zip" "$ROM_ENTRY" > app/src/main/assets/sonic1.md
          test -s app/src/main/assets/sonic1.md
      - name: Build the exact REV00 source baseline for patching
        run: |
          set -euo pipefail
          git clone --depth 1 --branch AS https://github.com/sonicretro/s1disasm.git /tmp/s1disasm
          sed -i 's/^Revision = 1$/Revision = 0/' /tmp/s1disasm/sonic.asm
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4
          chmod +x /tmp/s1disasm/build_tools/Linux-x86_64/asl /tmp/s1disasm/build_tools/Linux-x86_64/p2bin
          cd /tmp/s1disasm
          lua5.4 build.lua
          test -s s1built.bin
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          original = Path('/home/runner/work/Silver_the_headhog/Silver_the_headhog/sonic1-persian/app/src/main/assets/sonic1.md').read_bytes()
          rebuilt = Path('/tmp/s1disasm/s1built.bin').read_bytes()
          print('Original ROM:', len(original), hashlib.sha256(original).hexdigest())
          print('REV00 source build:', len(rebuilt), hashlib.sha256(rebuilt).hexdigest())
          print('BASELINE_MATCH=' + ('exact' if original == rebuilt else 'not-exact'))
          Path('/home/runner/work/Silver_the_headhog/Silver_the_headhog/sonic1-persian/rev00-source-build.bin').write_bytes(rebuilt)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sonic1-rev00-source-build
          path: sonic1-persian/rev00-source-build.bin
      - name: Inspect ROM revision and printable text
        run: |
          python tools/inspect_rom_header.py app/src/main/assets/sonic1.md | tee rom-inspection.txt
      - uses: actions/upload-artifact@v4
        with:
          name: sonic1-original-rom-working-copy
          path: sonic1-persian/app/src/main/assets/sonic1.md
      - name: Generate Persian glyph tiles for Mega Drive
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-core
          python -m pip install --quiet pillow arabic-reshaper python-bidi
          python tools/build_persian_font.py persian-font
      - name: Generate original ROM graphics atlas for Persian localization
        run: |
          python -m pip install --quiet pillow
          python tools/rom_tile_atlas.py app/src/main/assets/sonic1.md tile-atlas
      - uses: actions/upload-artifact@v4
        with:
          name: sonic1-rom-inspection
          path: |
            sonic1-persian/rom-inspection.txt
            sonic1-persian/LOCALIZATION_FINDINGS_FA.md
      - uses: actions/upload-artifact@v4
        with:
          name: sonic1-persian-font-tiles
          path: |
            sonic1-persian/persian-font/*.png
            sonic1-persian/persian-font/*.4bpp
            sonic1-persian/persian-font/manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: sonic1-rom-tile-atlas
          path: sonic1-persian/tile-atlas/*.png
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: sonic1-persian-debug
          path: sonic1-persian/app/build/outputs/apk/debug/app-debug.apk
