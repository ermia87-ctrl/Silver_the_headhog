<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>سونیک ۱ فارسی</title>
<style>
html,body,#game{margin:0;width:100%;height:100%;min-height:100%;overflow:hidden;background:#000}
body{position:fixed;inset:0}
#game{direction:ltr}
#boot-error{display:none;position:fixed;inset:0;z-index:99999;background:#000;color:#fff;font:16px Tahoma,sans-serif;text-align:center;padding:24px;box-sizing:border-box;direction:rtl}
</style>
<script>
window.EJS_player = '#game';
window.EJS_core = 'genesis_plus_gx';
window.EJS_gameName = 'سونیک ۱ فارسی';
window.EJS_gameUrl = 'https://appassets.androidplatform.net/assets/sonic1.md';
window.EJS_pathtodata = 'https://appassets.androidplatform.net/assets/data/';
window.EJS_startOnLoaded = true;
window.EJS_volume = 1;
window.EJS_language = 'en-US';
window.EJS_backgroundColor = '#000000';
window.EJS_gameID = 'sonic1-persian-rev00';
window.addEventListener('error', function () {
  var box = document.getElementById('boot-error');
  if (box) {
    box.style.display = 'block';
    box.textContent = 'بازی بارگذاری نشد. فایل‌های داخلی موتور اجرا یا ROM مشکل دارند.';
  }
});
</script>
<script src="data/loader.js"></script>
</head>
<body>
<div id="game"></div>
<div id="boot-error">در حال اجرای بازی…</div>
</body>
</html>
