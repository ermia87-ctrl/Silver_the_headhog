name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  export-android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Godot and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.3
          use-dotnet: false
          include-templates: true

      - name: Verify tools
        run: |
          godot --version
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Import project
        run: godot --headless --editor --path . --quit

      - name: Export debug APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/Silver-the-Hedgehog.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Silver-the-Hedgehog-Android
          path: build/Silver-the-Hedgehog.apk
          if-no-files-found: error
