name: Android debug build

on:
  push:
    paths:
      - "sonic1-persian/**"
      - ".github/workflows/sonic1-persian-android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sonic1-persian
    steps:
      - uses: actions/checkout@v4
      - name: Prepare the user's supplied game ROM
        run: |
          set -euo pipefail
          ROM_ENTRY="$(unzip -Z1 "Sonic The Hedgehog (USA, Europe).zip" | grep -Ei '\.(md|bin|gen)$' | head -n 1)"
          test -n "$ROM_ENTRY"
          mkdir -p app/src/main/assets
          unzip -p "Sonic The Hedgehog (USA, Europe).zip" "$ROM_ENTRY" > app/src/main/assets/sonic1.md
          test -s app/src/main/assets/sonic1.md
      - name: Inspect ROM revision and printable text
        run: |
          python tools/inspect_rom_header.py app/src/main/assets/sonic1.md | tee rom-inspection.txt
      - name: Generate original ROM graphics atlas for Persian localization
        run: |
          python -m pip install --quiet pillow
          python tools/rom_tile_atlas.py app/src/main/assets/sonic1.md tile-atlas
      - uses: actions/upload-artifact@v4
        with:
          name: sonic1-rom-inspection
          path: |
            sonic1-persian/rom-inspection.txt
            sonic1-persian/LOCALIZATION_FINDINGS_FA.md
      - uses: actions/upload-artifact@v4
        with:
          name: sonic1-rom-tile-atlas
          path: sonic1-persian/tile-atlas/*.png
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: sonic1-persian-debug
          path: sonic1-persian/app/build/outputs/apk/debug/app-debug.apk
