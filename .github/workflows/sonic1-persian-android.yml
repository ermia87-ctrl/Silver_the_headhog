name: Android debug build

on:
  push:
    paths:
      - "sonic1-persian/**"
      - ".github/workflows/sonic1-persian-android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sonic1-persian
    steps:
      - uses: actions/checkout@v4
      - name: Prepare the user's supplied game ROM
        run: |
          set -euo pipefail
          ROM_ENTRY="$(unzip -Z1 "Sonic The Hedgehog (USA, Europe).zip" | grep -Ei '\.(md|bin|gen)$' | head -n 1)"
          test -n "$ROM_ENTRY"
          mkdir -p app/src/main/assets
          unzip -p "Sonic The Hedgehog (USA, Europe).zip" "$ROM_ENTRY" > app/src/main/assets/sonic1.md
          test -s app/src/main/assets/sonic1.md
      - name: Build the exact REV00 source baseline for patching
        run: |
          set -euo pipefail
          git clone --depth 1 --branch AS https://github.com/sonicretro/s1disasm.git /tmp/s1disasm
          sed -i 's/^Revision = 1$/Revision = 0/' /tmp/s1disasm/sonic.asm
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4
          chmod +x /tmp/s1disasm/build_tools/Linux-x86_64/asl /tmp/s1disasm/build_tools/Linux-x86_64/p2bin
          cd /tmp/s1disasm
          lua5.4 build.lua
          test -s s1built.bin
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          original = Path('/home/runner/work/Silver_the_headhog/Silver_the_headhog/sonic1-persian/app/src/main/assets/sonic1.md').read_bytes()
          rebuilt = Path('/tmp/s1disasm/s1built.bin').read_bytes()
          print('Original ROM:', len(original), hashlib.sha256(original).hexdigest())
          print('REV00 source build:', len(rebuilt), hashlib.sha256(rebuilt).hexdigest())
          print('BASELINE_MATCH=' + ('exact' if original == rebuilt else 'not-exact'))
          Path('/home/runner/work/Silver_the_headhog/Silver_the_headhog/sonic1-persian/rev00-source-build.bin').write_bytes(rebuilt)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sonic1-rev00-source-build
          path: sonic1-persian/rev00-source-build.bin
      - name: Inspect ROM revision and printable text
        run: |
          python tools/inspect_rom_header.py app/src/main/assets/sonic1.md | tee rom-inspection.txt
      - uses: actions/upload-artifact@v4
        with:
          name: sonic1-original-rom-working-copy
          path: sonic1-persian/app/src/main/assets/sonic1.md
      - name: Generate Persian glyph tiles for Mega Drive
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-core
          python -m pip install --quiet pillow arabic-reshaper python-bidi
          python tools/build_persian_font.py persian-font
      - name: Build Nemesis compressor and encode Persian glyph tiles
        run: |
          set -euo pipefail
          git clone --depth 1 --recurse-submodules https://github.com/Clownacy/clownnemesis.git /tmp/clownnemesis
          cmake -S /tmp/clownnemesis -B /tmp/clownnemesis/build -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/clownnemesis/build --config Release --parallel 2
          TOOL="$(find /tmp/clownnemesis/build -type f -name clownnemesis-tool -perm -111 | head -n 1)"
          test -n "$TOOL"
          python tools/compress_persian_tiles.py persian-font persian-font-nemesis "$TOOL"
      - name: Replace the title PRESS START graphics with Persian tiles
        run: |
          set -euo pipefail
          python tools/patch_title_press_start.py /tmp/s1disasm /tmp/clownnemesis/build/clownnemesis-tool
          cd /tmp/s1disasm
          lua5.4 build.lua
          test -s s1built.bin
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root = Path('/home/runner/work/Silver_the_headhog/Silver_the_headhog/sonic1-persian')
          original = root / 'app/src/main/assets/sonic1.md'
          patched = Path('/tmp/s1disasm/s1built.bin')
          before = original.read_bytes()
          after = patched.read_bytes()
          if len(after) > len(before):
              raise SystemExit(f'Patched ROM unexpectedly grew: {len(before)} -> {len(after)}')
          if before == after:
              raise SystemExit('Persian title patch did not change the ROM')
          if len(after) < len(before):
              missing = len(before) - len(after)
              if missing > 0x1000 or missing % 2:
                  raise SystemExit(f'Unexpected ROM truncation: {missing} bytes')
              # Preserve the original cartridge padding bytes so the ROM keeps
              # its exact 512 KiB size after the compressed Nemesis asset shrinks.
              after += before[len(after):]
          patched = bytearray(after)
          patched[0x1A4:0x1A8] = (len(patched) - 1).to_bytes(4, 'big')
          checksum = sum(
              int.from_bytes(patched[i:i+2], 'big')
              for i in range(0x200, len(patched), 2)
          ) & 0xFFFF
          patched[0x18E:0x190] = checksum.to_bytes(2, 'big')
          after = bytes(patched)
          (root / 'app/src/main/assets/sonic1.md').write_bytes(after)
          (root / 'persian-title-patched.md').write_bytes(after)
          print('ROM_SIZE=' + str(len(after)))
          print('ROM_HEADER_END=' + after[0x1A4:0x1A8].hex())
          print('ROM_CHECKSUM=' + after[0x18E:0x190].hex())
          print('ORIGINAL_SHA256=' + hashlib.sha256(before).hexdigest())
          print('PERSIAN_PATCHED_SHA256=' + hashlib.sha256(after).hexdigest())
          print('PERSIAN_TITLE_PATCH=verified')
          PY
      - name: Replace SCORE TIME and RINGS HUD labels with Persian tiles
        run: |
          set -euo pipefail
          python tools/patch_hud_persian.py /tmp/s1disasm /tmp/clownnemesis/build/clownnemesis-tool
          cd /tmp/s1disasm
          lua5.4 build.lua
          test -s s1built.bin
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root = Path('/home/runner/work/Silver_the_headhog/Silver_the_headhog/sonic1-persian')
          current = root / 'app/src/main/assets/sonic1.md'
          rebuilt = Path('/tmp/s1disasm/s1built.bin')
          before = current.read_bytes()
          after = rebuilt.read_bytes()
          if len(after) > len(before):
              raise SystemExit(f'Persian HUD build unexpectedly grew: {len(before)} -> {len(after)}')
          if before == after:
              raise SystemExit('Persian HUD patch did not change the ROM')
          if len(after) < len(before):
              missing = len(before) - len(after)
              if missing > 0x1000 or missing % 2:
                  raise SystemExit(f'Unexpected ROM truncation: {missing} bytes')
              after += before[len(after):]
          patched = bytearray(after)
          patched[0x1A4:0x1A8] = (len(patched) - 1).to_bytes(4, 'big')
          checksum = sum(int.from_bytes(patched[i:i+2], 'big') for i in range(0x200, len(patched), 2)) & 0xFFFF
          patched[0x18E:0x190] = checksum.to_bytes(2, 'big')
          after = bytes(patched)
          (root / 'app/src/main/assets/sonic1.md').write_bytes(after)
          (root / 'persian-title-patched.md').write_bytes(after)
          (root / 'persian-hud-patched.md').write_bytes(after)
          print('ROM_SIZE=' + str(len(after)))
          print('ROM_CHECKSUM=' + after[0x18E:0x190].hex())
          print('PERSIAN_TITLE_AND_HUD_PATCH=verified')
          print('PERSIAN_HUD_SHA256=' + hashlib.sha256(after).hexdigest())
          PY
      - name: Connect Persian credits, Try Again and Level Select inside ROM
        run: |
          set -euo pipefail
          TOOL="$(find /tmp/clownnemesis/build -type f -name clownnemesis-tool -perm -111 | head -n 1)"
          test -n "$TOOL"
          python tools/patch_credits_level_select.py /tmp/s1disasm "$TOOL"
          cd /tmp/s1disasm
          lua5.4 build.lua
          test -s s1built.bin
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root = Path('/home/runner/work/Silver_the_headhog/Silver_the_headhog/sonic1-persian')
          current = root / 'app/src/main/assets/sonic1.md'
          rebuilt = Path('/tmp/s1disasm/s1built.bin')
          before = current.read_bytes()
          after = rebuilt.read_bytes()
          if len(after) != len(before):
              raise SystemExit(f'ROM size changed during Persian integration: {len(before)} -> {len(after)}')
          if after == before:
              raise SystemExit('Credits/Level Select patch did not change ROM')
          patched = bytearray(after)
          patched[0x1A4:0x1A8] = (len(patched) - 1).to_bytes(4, 'big')
          checksum = sum(int.from_bytes(patched[i:i+2], 'big') for i in range(0x200, len(patched), 2)) & 0xFFFF
          patched[0x18E:0x190] = checksum.to_bytes(2, 'big')
          after = bytes(patched)
          current.write_bytes(after)
          (root / 'persian-credits-level-select-patched.md').write_bytes(after)
          print('ROM_SIZE=' + str(len(after)))
          print('ROM_CHECKSUM=' + after[0x18E:0x190].hex())
          print('PERSIAN_CREDITS_TRY_AGAIN_LEVEL_SELECT=verified')
          print('ROM_SHA256=' + hashlib.sha256(after).hexdigest())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sonic1-persian-title-rom
          path: |
            sonic1-persian/title-patch/press-start-persian.png
            sonic1-persian/title-patch/press-start-persian.4bpp
            sonic1-persian/title-patch/patch-report.json
            sonic1-persian/persian-title-patched.md
            sonic1-persian/persian-hud-patched.md
            sonic1-persian/persian-credits-level-select-patched.md
            sonic1-persian/credits-level-select-patch/*.png
            sonic1-persian/credits-level-select-patch/integration-report.json
            sonic1-persian/hud-patch/*.png
            sonic1-persian/hud-patch/hud-patch-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: sonic1-persian-nemesis-glyphs
          path: |
            sonic1-persian/persian-font-nemesis/*.nem
            sonic1-persian/persian-font-nemesis/compression-report.json
      - name: Generate original ROM graphics atlas for Persian localization
        run: |
          python -m pip install --quiet pillow
          python tools/rom_tile_atlas.py app/src/main/assets/sonic1.md tile-atlas
      - uses: actions/upload-artifact@v4
        with:
          name: sonic1-rom-inspection
          path: |
            sonic1-persian/rom-inspection.txt
            sonic1-persian/LOCALIZATION_FINDINGS_FA.md
      - uses: actions/upload-artifact@v4
        with:
          name: sonic1-persian-font-tiles
          path: |
            sonic1-persian/persian-font/*.png
            sonic1-persian/persian-font/*.4bpp
            sonic1-persian/persian-font/manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: sonic1-rom-tile-atlas
          path: sonic1-persian/tile-atlas/*.png
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Name the final Persian APK clearly
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Sonic-Persian-Gulf-Preview.apk
          test -s app/build/outputs/apk/debug/Sonic-Persian-Gulf-Preview.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Sonic-Persian-Gulf-Preview
          path: sonic1-persian/app/build/outputs/apk/debug/Sonic-Persian-Gulf-Preview.apk
