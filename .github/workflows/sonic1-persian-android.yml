name: Build Sonic Persian Android APK

on:
  workflow_dispatch:
  push:
    branches: [ sonic1-persian-port ]
    paths:
      - 'sonic1-persian/android/**'
      - '.github/workflows/sonic1-persian-android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK components
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -n "$ANDROID_HOME"
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Fetch open-source PicoDrive ARM64 core
        working-directory: sonic1-persian/android
        run: |
          mkdir -p app/src/main/assets
          curl --fail --location --retry 3 \
            https://buildbot.libretro.com/nightly/android/latest/arm64-v8a/picodrive_libretro_android.so.zip \
            --output /tmp/picodrive.zip
          unzip -l /tmp/picodrive.zip
          unzip -o /tmp/picodrive.zip -d app/src/main/assets
          test -f app/src/main/assets/picodrive_libretro_android.so

      - name: Build debug APK
        working-directory: sonic1-persian/android
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sonic-Persian-Android-ARM64
          path: sonic1-persian/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
